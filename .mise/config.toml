min_version = "2026.7.0"

[env]
ANSIBLE_HOME = "{{config_root}}/ansible/.dependencies"
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"

[tools]
uv = "0.13.5"
age = "1.3.2"
cloudflared = "2026.10.5"
flux2 = "2.9.6"
gh = "2.103.2"
gum = "2.0.2"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "24.22.0"
oxfmt = "0.74.0"
sops = "3.13.3"
yq = "4.54.1"
zizmor = "1.31.1"

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

[hooks]
postinstall = "lefthook install"
