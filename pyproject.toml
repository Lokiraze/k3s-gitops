[project]
name = "home-cluster"
version = "0.0.0"
# Ansible 2.21 uses dataclasses internals removed in Python 3.15.
requires-python = ">=3.14,<3.15"
dependencies = ["ansible-core==2.21.5", "netaddr==1.3.0", "PyYAML==6.0.3"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
