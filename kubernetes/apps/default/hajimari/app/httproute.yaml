---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hajimari
  namespace: default
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - hajimari.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: hajimari
      port: 3000
