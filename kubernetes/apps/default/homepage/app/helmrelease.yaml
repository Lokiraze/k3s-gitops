---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: default
spec:
  suspend: false
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      fullnameOverride: homepage
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        pod:
          automountServiceAccountToken: true
        containers:
          app:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
            env:
              TZ: ${TIMEZONE}
              HOMEPAGE_ALLOWED_HOSTS: ${SECRET_DOMAIN}
            envFrom:
            - secretRef:
                name: homepage-widgets
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                    httpHeaders:
                    - name: Host
                      value: ${SECRET_DOMAIN}
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                    httpHeaders:
                    - name: Host
                      value: ${SECRET_DOMAIN}
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
        serviceAccount:
          name: homepage
    service:
      app:
        controller: main
        ports:
          http:
            port: 3000
    persistence:
      config:
        type: emptyDir
        globalMounts:
        - path: /app/config
      config-files:
        type: configMap
        identifier: config
        globalMounts:
        - path: /app/config/kubernetes.yaml
          subPath: kubernetes.yaml
        - path: /app/config/services.yaml
          subPath: services.yaml
        - path: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
        - path: /app/config/widgets.yaml
          subPath: widgets.yaml
        - path: /app/config/settings.yaml
          subPath: settings.yaml
        - path: /app/config/custom.css
          subPath: custom.css
        - path: /app/config/custom.js
          subPath: custom.js
      logs:
        type: emptyDir
        globalMounts:
        - path: /app/config/logs
    configMaps:
      config:
        data:
          kubernetes.yaml: 'mode: cluster

            ingress: false

            gateway: true

            '
          services.yaml: '[]

            '
          bookmarks.yaml: '[]

            '
          widgets.yaml: "- search:\n    provider: duckduckgo\n    target: _blank\n"
          settings.yaml: |
            title: Home
            theme: dark
            color: slate
            headerStyle: underlined
            statusStyle: dot
            iconStyle: flat
            layout:
              Home:
                style: row
                columns: 3
              Media:
                style: row
                columns: 3
              Infrastructure:
                style: row
                columns: 3
          custom.css: ''
          custom.js: ''
