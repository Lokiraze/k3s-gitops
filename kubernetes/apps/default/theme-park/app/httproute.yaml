---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: theme-park
  namespace: default
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - theme-park.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: theme-park
      port: 80
