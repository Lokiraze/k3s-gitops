---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Home Assistant
    gethomepage.dev/group: Home
    gethomepage.dev/icon: mdi-home-assistant
    gethomepage.dev/href: https://hass.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - hass.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: home-assistant
      port: 8123
