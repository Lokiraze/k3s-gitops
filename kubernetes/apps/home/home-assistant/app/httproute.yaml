---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - hass.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: home-assistant
      port: 8123
