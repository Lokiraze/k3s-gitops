---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Refuse to start against an unverified or empty restore.
    initContainers:
      verify-restored-data:
        image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        command:
        - /bin/sh
        - -ec
        - test "$(cat /restore/.restore-verified)" = "home-assistant-config"; test -s
          /restore/.storage/core.config_entries
        volumeMounts:
        - name: config
          mountPath: /restore
          readOnly: true
    image:
      repository: ghcr.io/home-operations/home-assistant
      tag: 2026.10.2@sha256:0d289f21951f9ecf0bf8888089c6d43f379611c47fe84f13d3302e83daa3c8fa
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${HOME_ASSISTANT_LB}
        externalTrafficPolicy: Local
        ports:
          http:
            port: 8123
    ingress:
      main:
        enabled: false
        annotations:
          hajimari.io/enable: 'true'
          hajimari.io/icon: home-automation
        hosts:
        - host: hass.${SECRET_DOMAIN}
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - hass.${SECRET_DOMAIN}
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        enabled: true
        existingClaim: home-assistant-config
    addons:
      codeserver:
        enabled: false
        image:
          repository: ghcr.io/coder/code-server
          tag: 4.20.0
        workingDir: /config
        args:
        - --auth
        - none
        - --user-data-dir
        - /config/.vscode
        - --extensions-dir
        - /config/.vscode
        ingress:
          enabled: false
          annotations: {}
          hosts:
          - host: hass-config.${SECRET_DOMAIN}
            paths:
            - path: /
              pathType: Prefix
          tls:
          - hosts:
            - hass-config.${SECRET_DOMAIN}
        volumeMounts:
        - name: config
          mountPath: /config
  suspend: false
