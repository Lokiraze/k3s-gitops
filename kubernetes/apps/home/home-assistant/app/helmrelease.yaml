---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: home-assistant
      nameOverride: home-assistant
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: home-assistant
        containers:
          home-assistant:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.10.2@sha256:a582f4b113e3018517a5ae9727b873e262aa787fa97f07b97b71bfc57f14d470
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          verify-restored-data:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
            - /bin/sh
            - -ec
            - test "$(cat /restore/.restore-verified)" = "home-assistant-config"; test -s /restore/.storage/core.config_entries
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${HOME_ASSISTANT_LB}
        externalTrafficPolicy: Local
        ports:
          http:
            port: 8123
        controller: main
        forceRename: home-assistant
    persistence:
      config:
        enabled: true
        existingClaim: home-assistant-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            home-assistant:
            - path: /config
            verify-restored-data:
            - path: /restore
              readOnly: true
  suspend: false
  # Preserve the immutable selector from the existing deployment during chart migration.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: home-assistant
        patch: |
          - op: replace
            path: /spec/selector
            value:
              matchLabels:
                app.kubernetes.io/instance: home-assistant
                app.kubernetes.io/name: home-assistant
