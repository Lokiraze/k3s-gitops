---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home
  annotations:
    rebuild.homelab/status: suspended-pending-version-storage-and-restore-checks
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Refuse to start against an unverified or empty restore.
    initContainers:
      verify-restored-data:
        image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
        - /bin/sh
        - -ec
        - test "$(cat /restore/.restore-verified)" = "home-assistant-config"; test -s
          /restore/.storage/core.config_entries
        volumeMounts:
        - name: config
          mountPath: /restore
          readOnly: true
    image:
      repository: ghcr.io/onedr0p/home-assistant
      tag: 2025.3.3
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${HOME_ASSISTANT_LB}
        externalTrafficPolicy: Local
        ports:
          http:
            port: 8123
    ingress:
      main:
        enabled: false
        annotations:
          hajimari.io/enable: 'true'
          hajimari.io/icon: home-automation
        hosts:
        - host: hass.${SECRET_DOMAIN}
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - hass.${SECRET_DOMAIN}
    probes:
      liveness:
        enabled: false
      readiness:
        enabled: false
      startup:
        enabled: false
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        enabled: true
        existingClaim: home-assistant-config
    addons:
      codeserver:
        enabled: false
        image:
          repository: ghcr.io/coder/code-server
          tag: 4.20.0
        workingDir: /config
        args:
        - --auth
        - none
        - --user-data-dir
        - /config/.vscode
        - --extensions-dir
        - /config/.vscode
        ingress:
          enabled: false
          annotations: {}
          hosts:
          - host: hass-config.${SECRET_DOMAIN}
            paths:
            - path: /
              pathType: Prefix
          tls:
          - hosts:
            - hass-config.${SECRET_DOMAIN}
        volumeMounts:
        - name: config
          mountPath: /config
  suspend: true
