---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: home
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  releaseName: eclipse-mosquitto
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    global:
      fullnameOverride: eclipse-mosquitto
      nameOverride: mosquitto
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: eclipse-mosquitto
        containers:
          eclipse-mosquitto:
            image:
              repository: eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 1883
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 1883
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  tcpSocket:
                    port: 1883
                  timeoutSeconds: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${MQTT_LB}
        controller: main
        forceRename: eclipse-mosquitto
        ports:
          mqtt:
            port: 1883
    configMaps:
      config:
        forceRename: eclipse-mosquitto-config
        data:
          mosquitto.conf: 'per_listener_settings false

            listener 1883

            allow_anonymous true

            '
    persistence:
      mosquitto-config:
        type: configMap
        name: eclipse-mosquitto-config
        advancedMounts:
          main:
            eclipse-mosquitto:
            - path: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
  suspend: false
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: eclipse-mosquitto
        patch: "- op: replace\n  path: /spec/selector\n  value:\n    matchLabels:\n      app.kubernetes.io/instance:\
          \ eclipse-mosquitto\n      app.kubernetes.io/name: mosquitto\n"
