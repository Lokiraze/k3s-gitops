---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: home
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  releaseName: eclipse-mosquitto
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 5m
  values:
    global:
      fullnameOverride: eclipse-mosquitto
      nameOverride: mosquitto
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: eclipse-mosquitto
        containers:
          eclipse-mosquitto:
            image:
              repository: eclipse-mosquitto
              tag: 2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 1883
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 1883
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  tcpSocket:
                    port: 1883
                  timeoutSeconds: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${MQTT_LB}
        controller: main
        forceRename: eclipse-mosquitto
        ports:
          mqtt:
            port: 1883
    configMaps:
      config:
        forceRename: eclipse-mosquitto-config
        data:
          mosquitto.conf: |
            per_listener_settings false
            listener 1883
            allow_anonymous true
    persistence:
      mosquitto-config:
        type: configMap
        name: eclipse-mosquitto-config
        advancedMounts:
          main:
            eclipse-mosquitto:
            - path: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
  suspend: false
  # Preserve the immutable selector from the existing deployment during chart migration.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: eclipse-mosquitto
        patch: |
          - op: replace
            path: /spec/selector
            value:
              matchLabels:
                app.kubernetes.io/instance: eclipse-mosquitto
                app.kubernetes.io/name: mosquitto
