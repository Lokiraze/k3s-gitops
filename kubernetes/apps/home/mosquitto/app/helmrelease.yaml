---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mosquitto
  namespace: home
  annotations:
    rebuild.homelab/status: suspended-pending-version-storage-and-restore-checks
spec:
  releaseName: eclipse-mosquitto
  interval: 5m
  chart:
    spec:
      chart: mosquitto
      version: 4.8.2
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
      interval: 5m
  values:
    image:
      repository: eclipse-mosquitto
      tag: 2.0.18
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${MQTT_LB}
  suspend: true
