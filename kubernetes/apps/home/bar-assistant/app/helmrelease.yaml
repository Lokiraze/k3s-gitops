apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bar-assistant
  namespace: home
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      fullnameOverride: bar-assistant
      createDefaultServiceAccount: false
    controllers:
      api:
        type: deployment
        forceRename: bar-assistant-api
        strategy: Recreate
        pod:
          nodeSelector:
            kubernetes.io/hostname: k8s-phoenix
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: barassistant/server
              tag: 6.11.1@sha256:545abe1a84c8d33255877297c75d87c0aa4e66598b074309ee40d6977ea665c8
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
                ephemeral-storage: 32Mi
              limits:
                cpu: 750m
                memory: 768Mi
                ephemeral-storage: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/version
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 120
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/version
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/version
                    port: 8080
                  periodSeconds: 30
                  failureThreshold: 3
                  timeoutSeconds: 5
            env:
              TZ: ${TIMEZONE}
              APP_URL: https://bar.${SECRET_DOMAIN}/bar
              APP_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bar-assistant-secret
                    key: APP_KEY
              MEILISEARCH_HOST: http://bar-assistant-search:7700
              MEILISEARCH_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bar-assistant-secret
                    key: MEILI_MASTER_KEY
              CACHE_DRIVER: file
              SESSION_DRIVER: file
              QUEUE_CONNECTION: sync
              ALLOW_REGISTRATION: 'true'
              ENABLE_PASSWORD_LOGIN: 'false'
              AUTHELIA_BASE_URL: https://auth.${SECRET_DOMAIN}
              AUTHELIA_CLIENT_ID: bar-assistant
              AUTHELIA_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: bar-assistant-secret
                    key: AUTHELIA_CLIENT_SECRET
              AUTHELIA_REDIRECT_URI: https://bar.${SECRET_DOMAIN}/oauth/callback
              MAIL_REQUIRE_CONFIRMATION: 'false'
              PHP_OPCACHE_MEMORY_CONSUMPTION: '128'
              PHP_MEMORY_LIMIT: 256M
        initContainers:
          wait-for-search:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command:
            - sh
            - -ec
            - for i in $(seq 1 120); do wget -q -T 2 -O /dev/null http://bar-assistant-search:7700/health && exit
              0; sleep 2; done; exit 1
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                cpu: 100m
                memory: 32Mi
      web:
        type: deployment
        forceRename: bar-assistant
        strategy: Recreate
        pod:
          nodeSelector:
            kubernetes.io/hostname: k8s-phoenix
          automountServiceAccountToken: false
          enableServiceLinks: false
        containers:
          app:
            image:
              repository: barassistant/salt-rim
              tag: 5.10.1@sha256:8ed9c33bbb5ec330ae6ad4a7c498282fdb27ecc643e8320c753ae35e39f27394
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
                ephemeral-storage: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
                ephemeral-storage: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 120
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  periodSeconds: 30
                  failureThreshold: 3
                  timeoutSeconds: 5
            env:
              API_URL: https://bar.${SECRET_DOMAIN}/bar
              MEILISEARCH_URL: https://bar.${SECRET_DOMAIN}/search
              DEFAULT_LOCALE: en-US
              ALLOW_REGISTRATION: 'false'
              REDIRECT_TO_SSO: 'true'
              MAILS_ENABLED: 'false'
      search:
        type: deployment
        forceRename: bar-assistant-search
        strategy: Recreate
        pod:
          nodeSelector:
            kubernetes.io/hostname: k8s-phoenix
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: getmeili/meilisearch
              tag: v1.56@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
                ephemeral-storage: 32Mi
              limits:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 7700
                  periodSeconds: 5
                  failureThreshold: 120
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 7700
                  periodSeconds: 10
                  failureThreshold: 3
                  timeoutSeconds: 5
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 7700
                  periodSeconds: 30
                  failureThreshold: 3
                  timeoutSeconds: 5
            env:
              MEILI_ENV: production
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bar-assistant-secret
                    key: MEILI_MASTER_KEY
              MEILI_NO_ANALYTICS: 'true'
              MEILI_MAX_INDEXING_MEMORY: 128MiB
              MEILI_MAX_INDEXING_THREADS: '1'
    service:
      api:
        controller: api
        forceRename: bar-assistant-api
        ports:
          http:
            port: 8080
      web:
        controller: web
        forceRename: bar-assistant
        ports:
          http:
            port: 8080
      search:
        controller: search
        forceRename: bar-assistant-search
        ports:
          http:
            port: 7700
    persistence:
      api-nginx:
        type: configMap
        identifier: api-nginx
        advancedMounts:
          api:
            app:
            - path: /etc/nginx/server-opts.d/100-sso-only.conf
              subPath: sso-only.conf
              readOnly: true
      data:
        existingClaim: bar-assistant-data
        advancedMounts:
          api:
            app:
            - path: /var/www/cocktails/storage/bar-assistant
      search:
        existingClaim: bar-assistant-search
        advancedMounts:
          search:
            app:
            - path: /meili_data
    configMaps:
      api-nginx:
        data:
          sso-only.conf: |
            # SSO uses registration internally; block the public password-signup route.
            location ~ ^/(?:index[.]php/)?api/auth/register/?$ {
                return 404;
            }
