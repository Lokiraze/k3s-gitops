apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bar-assistant
  namespace: home
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Bar Assistant
    gethomepage.dev/group: Home
    gethomepage.dev/icon: bar-assistant.svg
    gethomepage.dev/href: https://bar.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - bar.${SECRET_DOMAIN}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /bar
    backendRefs:
    - name: bar-assistant-api
      port: 8080
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
  - matches:
    - path:
        type: PathPrefix
        value: /search
    backendRefs:
    - name: bar-assistant-search
      port: 7700
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: bar-assistant
      port: 8080
