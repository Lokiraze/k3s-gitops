apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bar-assistant
  namespace: home
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: bar-assistant
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: network
      podSelector:
        matchLabels:
          gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 7700
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/instance: bar-assistant
    ports:
    - protocol: TCP
      port: 7700
