---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: music-assistant
  namespace: home
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - music.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: music-assistant
      port: 8095
