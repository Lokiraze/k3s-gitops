---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: music-assistant
  namespace: home
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Music Assistant
    gethomepage.dev/group: Home
    gethomepage.dev/icon: mdi-music
    gethomepage.dev/href: https://music.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - music.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: music-assistant
      port: 8095
