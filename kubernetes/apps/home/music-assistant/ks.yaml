---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-music-assistant
  namespace: flux-system
spec:
  suspend: false
  interval: 30m
  path: ./kubernetes/apps/home/music-assistant/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: legacy-app-settings
    - kind: Secret
      name: legacy-app-secrets
  targetNamespace: home
  wait: false
