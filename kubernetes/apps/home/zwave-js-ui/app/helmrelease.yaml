---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zwave-js-ui
  namespace: home
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: zwave-js-ui
      nameOverride: zwave-js-ui
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: zwave-js-ui
        containers:
          zwave-js-ui:
            image:
              repository: ghcr.io/zwave-js/zwave-js-ui
              tag: 11.25.2@sha256:ac4874a3cbea61c0c60002a8fd8ae05104cc8eb2eae91aa05bd184972aa06853
            env:
              TZ: ${TIMEZONE}
            securityContext:
              privileged: true
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: 8091
                    scheme: HTTP
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: 8091
                    scheme: HTTP
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 1
              startup:
                enabled: false
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: usb
                    operator: In
                    values:
                    - zwave
        initContainers:
          verify-restored-data:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command:
            - /bin/sh
            - -ec
            - test "$(cat /restore/.restore-verified)" = "zwavejs-config"; test -s /restore/settings.json
    service:
      main:
        ports:
          http:
            port: 8091
          websocket:
            enabled: true
            port: 3000
        controller: main
        forceRename: zwave-js-ui
    persistence:
      config:
        enabled: true
        existingClaim: zwavejs-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            zwave-js-ui:
            - path: /usr/src/app/store
            verify-restored-data:
            - path: /restore
              readOnly: true
      usb:
        enabled: true
        type: hostPath
        hostPath: /dev/serial/by-id/usb-Silicon_Labs_HubZ_Smart_Home_Controller_6120113C-if00-port0
        hostPathType: CharDevice
        advancedMounts:
          main:
            zwave-js-ui:
            - path: /dev/serial/by-id/usb-Silicon_Labs_HubZ_Smart_Home_Controller_6120113C-if00-port0
  suspend: false
  # Preserve the immutable selector from the existing deployment during chart migration.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: zwave-js-ui
        patch: |
          - op: replace
            path: /spec/selector
            value:
              matchLabels:
                app.kubernetes.io/instance: zwave-js-ui
                app.kubernetes.io/name: zwave-js-ui
