---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zwave-js-ui
  namespace: home
  annotations:
    rebuild.homelab/status: suspended-pending-version-storage-and-restore-checks
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Refuse to start against an unverified or empty restore.
    initContainers:
      verify-restored-data:
        image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
        - /bin/sh
        - -ec
        - test "$(cat /restore/.restore-verified)" = "zwavejs-config"; test -s /restore/settings.json
        volumeMounts:
        - name: config
          mountPath: /restore
          readOnly: true
    image:
      repository: ghcr.io/zwave-js/zwave-js-ui
      tag: 11.24.3
    env:
      TZ: ${TIMEZONE}
    service:
      main:
        ports:
          http:
            port: 8091
          websocket:
            enabled: true
            port: 3000
    probes:
      liveness: &id001
        enabled: true
        custom: true
        spec:
          httpGet:
            path: /health
            port: 8091
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
      readiness: *id001
      startup:
        enabled: false
    ingress:
      main:
        enabled: false
        ingressClassName: nginx
        hosts:
        - host: zwave.${SECRET_DOMAIN}
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - zwave.${SECRET_DOMAIN}
    securityContext:
      privileged: true
    persistence:
      config:
        enabled: true
        existingClaim: zwavejs-config
        mountPath: /usr/src/app/store
      usb:
        enabled: true
        type: hostPath
        hostPath: /dev/serial/by-id/usb-Silicon_Labs_HubZ_Smart_Home_Controller_6120113C-if00-port0
        hostPathType: CharDevice
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: usb
              operator: In
              values:
              - zwave
  suspend: true
