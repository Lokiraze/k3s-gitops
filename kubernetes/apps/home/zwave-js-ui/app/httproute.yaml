---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zwave-js-ui
  namespace: home
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Z-Wave
    gethomepage.dev/group: Home
    gethomepage.dev/icon: mdi-lock
    gethomepage.dev/href: https://zwave.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - zwave.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: zwave-js-ui
      port: 8091
