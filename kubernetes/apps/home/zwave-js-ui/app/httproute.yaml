---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zwave-js-ui
  namespace: home
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - zwave.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: zwave-js-ui
      port: 8091
