# Protect the management UI separately from Home Assistant's Z-Wave websocket.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zwave-js-ui
  namespace: home
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zwave-js-ui
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: network
      podSelector:
        matchLabels:
          gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    ports:
    - protocol: TCP
      port: 8091
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: home
      podSelector:
        matchLabels:
          app.kubernetes.io/name: home-assistant
    ports:
    - protocol: TCP
      port: 3000
