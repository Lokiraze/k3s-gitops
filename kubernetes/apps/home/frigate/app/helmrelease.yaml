apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
  namespace: home
spec:
  suspend: false
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      fullnameOverride: frigate
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: k8s-bahamut
            tpu: google-coral
        initContainers:
          seed-config:
            image: &id001
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.18.2@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a
            command:
            - /bin/sh
            - -ec
            # Git owns config.yml; the database and users remain on the persistent volume.
            - cp /bootstrap/config.yml /config/config.yml; chmod 600 /config/config.yml
        containers:
          app:
            image: *id001
            env:
              TZ: ${TIMEZONE}
              FRIGATE_BACKYARD_PATHWAY_CAMERA_1:
                valueFrom:
                  secretKeyRef:
                    name: frigate
                    key: BACKYARD_PATHWAY_CAMERA_1
              FRIGATE_GARAGE_CAMERA:
                valueFrom:
                  secretKeyRef:
                    name: frigate
                    key: GARAGE_CAMERA
              FRIGATE_PORCH_CAMERA:
                valueFrom:
                  secretKeyRef:
                    name: frigate
                    key: PORCH_CAMERA
              FRIGATE_SIDE_ALLEY_CAMERA_1:
                valueFrom:
                  secretKeyRef:
                    name: frigate
                    key: SIDE_ALLEY_CAMERA_1
              FRIGATE_SIDE_ALLEY_CAMERA_2:
                valueFrom:
                  secretKeyRef:
                    name: frigate
                    key: SIDE_ALLEY_CAMERA_2
            envFrom:
            - secretRef:
                name: frigate
            securityContext:
              privileged: true
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 5000
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 5000
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: 5000
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 6
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 4Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8971
    persistence:
      config:
        existingClaim: frigate-config
        globalMounts:
        - path: /config
      bootstrap:
        type: configMap
        identifier: config
        advancedMounts:
          main:
            seed-config:
            - path: /bootstrap
              readOnly: true
      media:
        type: nfs
        server: 192.168.1.50
        path: /mnt/user/cctv/frigate
        advancedMounts:
          main:
            app:
            # Preserve the old chart mount: Frigate appends /frigate beneath /media.
            - path: /media
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        advancedMounts:
          main:
            app:
            - path: /dev/shm
      cache:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          main:
            app:
            - path: /tmp/cache
      usb:
        type: hostPath
        hostPath: /dev/bus/usb
        hostPathType: Directory
        advancedMounts:
          main:
            app:
            - path: /dev/bus/usb
      dri:
        type: hostPath
        hostPath: /dev/dri
        hostPathType: Directory
        advancedMounts:
          main:
            app:
            - path: /dev/dri
    configMaps:
      config:
        data:
          config.yml: |
            mqtt:
              host: eclipse-mosquitto.home.svc.cluster.local
              topic_prefix: frigate
            database:
              path: /config/frigate.db
            detectors:
              coral:
                type: edgetpu
                device: usb
            ffmpeg:
              input_args: preset-rtsp-generic
              hwaccel_args: preset-vaapi
            cameras:
              porch:
                ffmpeg:
                  inputs:
                  - path: '{FRIGATE_PORCH_CAMERA}'
                    roles:
                    - detect
                snapshots:
                  enabled: true
                detect:
                  height: 2160
                  width: 3840
                  fps: 5
              garage:
                ffmpeg:
                  inputs:
                  - path: '{FRIGATE_GARAGE_CAMERA}'
                    roles:
                    - detect
                snapshots:
                  enabled: true
                detect:
                  height: 2160
                  width: 3840
                  fps: 5
              backyard_pathway_1:
                ffmpeg:
                  inputs:
                  - path: '{FRIGATE_BACKYARD_PATHWAY_CAMERA_1}'
                    roles:
                    - detect
                snapshots:
                  enabled: true
                detect:
                  height: 2160
                  width: 3840
                  fps: 5
              side_alley_1:
                ffmpeg:
                  inputs:
                  - path: '{FRIGATE_SIDE_ALLEY_CAMERA_1}'
                    roles:
                    - detect
                snapshots:
                  enabled: true
                detect:
                  height: 2160
                  width: 3840
                  fps: 5
              side_alley_2:
                ffmpeg:
                  inputs:
                  - path: '{FRIGATE_SIDE_ALLEY_CAMERA_2}'
                    roles:
                    - detect
                snapshots:
                  enabled: true
                detect:
                  height: 2160
                  width: 3840
                  fps: 5
            auth:
              enabled: true
            tls:
              enabled: false
