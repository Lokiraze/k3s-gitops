apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-frigate-config
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-app-data
  claimRef:
    namespace: home
    name: frigate-config
  local:
    path: /var/lib/homelab/app-data/frigate-config
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-bahamut
