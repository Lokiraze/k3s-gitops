apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate
  namespace: home
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Cameras
    gethomepage.dev/group: Home
    gethomepage.dev/icon: frigate.svg
    gethomepage.dev/href: https://cctv.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - cctv.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: frigate
      port: 8971
