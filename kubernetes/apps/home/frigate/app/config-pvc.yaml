apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config
  namespace: home
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-app-data
  volumeName: local-frigate-config
