apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: security
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/authelia/authelia
              tag: 4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
            args:
            - --config
            - /config/configuration.yaml
            env:
              AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: authelia-secret
                    key: AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD
              AUTHELIA_SESSION_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: authelia-secret
                    key: AUTHELIA_SESSION_SECRET
              AUTHELIA_STORAGE_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: authelia-secret
                    key: AUTHELIA_STORAGE_ENCRYPTION_KEY
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 9091
                  periodSeconds: 10
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 9091
                  periodSeconds: 10
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 9091
                  periodSeconds: 10
                  failureThreshold: 3
    service:
      main:
        controller: main
        ports:
          http:
            port: 9091
    persistence:
      data:
        existingClaim: authelia-data
        globalMounts:
        - path: /data
      configuration:
        type: configMap
        name: authelia-config
        globalMounts:
        - path: /config
          readOnly: true
