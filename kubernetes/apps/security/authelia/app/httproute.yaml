apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: security
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - auth.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: authelia
      port: 9091
