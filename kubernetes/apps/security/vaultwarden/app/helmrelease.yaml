apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: security
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    global:
      fullnameOverride: vaultwarden
      nameOverride: vaultwarden
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: vaultwarden
        containers:
          vaultwarden:
            image:
              repository: ghcr.io/dani-garcia/vaultwarden
              tag: 1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
            env:
              TZ: ${TIMEZONE}
              DOMAIN: https://passwords.${SECRET_DOMAIN}
              SIGNUPS_ALLOWED: 'true'
            envFrom:
            - secretRef:
                name: vaultwarden
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          enableServiceLinks: false
    service:
      main:
        ports:
          http:
            port: 80
        controller: main
        forceRename: vaultwarden
    persistence:
      config:
        enabled: true
        existingClaim: vaultwarden-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            vaultwarden:
            - path: /data
  suspend: false
