---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: security
  annotations:
    rebuild.homelab/status: suspended-pending-version-storage-and-restore-checks
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    global:
      fullnameOverride: vaultwarden
      nameOverride: vaultwarden
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: vaultwarden
        containers:
          vaultwarden:
            image:
              repository: ghcr.io/dani-garcia/vaultwarden
              tag: 1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
            env:
              TZ: ${TIMEZONE}
              DOMAIN: https://passwords.${SECRET_DOMAIN}
            envFrom:
            - secretRef:
                name: vaultwarden
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
    service:
      main:
        ports:
          http:
            port: 80
        controller: main
        forceRename: vaultwarden
    persistence:
      config:
        enabled: true
        existingClaim: vaultwarden-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            vaultwarden:
            - path: /data
  suspend: true
