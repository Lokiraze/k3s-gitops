---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-unifi
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/network/unifi/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
    - kind: Secret
      name: cluster-secrets
    substitute:
      TIMEZONE: America/Phoenix
      UNIFI_LB: 192.168.69.82
  targetNamespace: network
  wait: false
