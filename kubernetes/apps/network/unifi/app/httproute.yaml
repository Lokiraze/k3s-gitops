---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi
  namespace: network
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: UniFi
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/icon: mdi-lan
    gethomepage.dev/href: https://unifi.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - unifi.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: unifi
      port: 8443
