---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-unifi-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-app-data
  claimRef:
    namespace: network
    name: unifi-db
  local:
    path: /var/lib/homelab/app-data/unifi-db
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-phoenix
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-db
  namespace: network
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-app-data
  volumeName: local-unifi-db
