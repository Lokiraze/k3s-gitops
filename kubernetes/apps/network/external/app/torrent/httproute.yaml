---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: torrent
  namespace: network
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - torrents.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: qbittorrent
      port: 8080
