---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: torrent
  namespace: network
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Downloads
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-download
    gethomepage.dev/href: https://torrents.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - torrents.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: qbittorrent
      port: 8080
