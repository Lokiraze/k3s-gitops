---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: network
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Jellyfin
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-jellyfin
    gethomepage.dev/href: https://media.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-external
    namespace: network
    sectionName: https
  hostnames:
  - media.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: jellyfin
      port: 8096
