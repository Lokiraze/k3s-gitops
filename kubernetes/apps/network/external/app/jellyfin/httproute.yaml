---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: network
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - media.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: jellyfin
      port: 8096
