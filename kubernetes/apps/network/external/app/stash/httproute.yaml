---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stash
  namespace: network
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Stash
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-folder-play
    gethomepage.dev/href: https://stash.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - stash.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: stash
      port: 9999
