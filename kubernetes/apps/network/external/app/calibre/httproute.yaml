---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calibre
  namespace: network
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Calibre
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-book-open-page-variant
    gethomepage.dev/href: https://calibre.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - calibre.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: calibre
      port: 8123
