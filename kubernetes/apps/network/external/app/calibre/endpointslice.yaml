---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: calibre
  namespace: network
  labels:
    kubernetes.io/service-name: calibre
    endpointslice.kubernetes.io/managed-by: homelab-gitops
addressType: IPv4
ports:
- port: 8123
  name: http
  protocol: TCP
endpoints:
- addresses:
  - ${NFS_SERVER}
  conditions:
    ready: true
