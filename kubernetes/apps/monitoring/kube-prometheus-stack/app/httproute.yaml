---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - prometheus.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-prometheus
      port: 9090
