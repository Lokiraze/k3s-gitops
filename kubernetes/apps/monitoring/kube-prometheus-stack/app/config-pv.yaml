---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-prometheus-kube-prometheus-stack-db-prometheus-kube-prometheus-stack-0
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-app-data
  claimRef:
    namespace: monitoring
    name: prometheus-kube-prometheus-stack-db-prometheus-kube-prometheus-stack-0
  local:
    path: /var/lib/homelab/app-data/prometheus-kube-prometheus-stack-db-prometheus-kube-prometheus-stack-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-odin
