---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Prowlarr
    gethomepage.dev/group: Media
    gethomepage.dev/icon: prowlarr.svg
    gethomepage.dev/href: https://prowlarr.${SECRET_DOMAIN}
    gethomepage.dev/description: Indexers and search activity
    gethomepage.dev/widget.type: prowlarr
    gethomepage.dev/widget.url: http://prowlarr.media.svc.cluster.local:80
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_PROWLARR_KEY}}'
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - prowlarr.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: prowlarr
      port: 80
