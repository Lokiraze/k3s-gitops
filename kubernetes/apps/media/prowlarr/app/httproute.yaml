---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: media
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - '{{ .Release.Name }}.${SECRET_DOMAIN}'
  rules:
  - backendRefs:
    - name: prowlarr
      port: 80
