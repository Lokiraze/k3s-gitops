---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    initContainers:
      verify-restored-data:
        image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        command:
        - /bin/sh
        - -ec
        - test "$(cat /restore/.restore-verified)" = "prowlarr-config"; test -s /restore/prowlarr.db
        volumeMounts:
        - name: config
          mountPath: /restore
          readOnly: true
    image:
      repository: ghcr.io/home-operations/prowlarr
      tag: 2.6.5.5623@sha256:6152751c3ea2e7751564f5952173d5e83eed0e09f3fabd2cb6bdb58690c39e2f
    env:
      TZ: ${TIMEZONE}
      PROWLARR__INSTANCE_NAME: Prowlarr
      PROWLARR__PORT: 80
      PROWLARR__APPLICATION_URL: https://{{ .Release.Name }}.${SECRET_DOMAIN}
      PROWLARR__LOG_LEVEL: info
    service:
      main:
        ports:
          http:
            port: 80
    ingress:
      main:
        enabled: false
        ingressClassName: nginx
        annotations: null
        hosts:
        - host: '{{ .Release.Name }}.${SECRET_DOMAIN}'
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - '{{ .Release.Name }}.${SECRET_DOMAIN}'
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        enabled: true
        existingClaim: prowlarr-config
  suspend: false
