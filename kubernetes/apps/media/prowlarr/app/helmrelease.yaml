---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: prowlarr
      nameOverride: prowlarr
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: prowlarr
        containers:
          prowlarr:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 2.6.5.5623@sha256:0e2e6e9a2a16683a160ff1c6830d8192231a0502ab0d605b416023b2ca225ff9
            env:
              TZ: ${TIMEZONE}
              PROWLARR__INSTANCE_NAME: Prowlarr
              PROWLARR__PORT: 80
              PROWLARR__APPLICATION_URL: https://{{ .Release.Name }}.${SECRET_DOMAIN}
              PROWLARR__LOG_LEVEL: info
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 80
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 80
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  tcpSocket:
                    port: 80
                  timeoutSeconds: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          verify-restored-data:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
            - /bin/sh
            - -ec
            - test "$(cat /restore/.restore-verified)" = "prowlarr-config"; test -s /restore/prowlarr.db
    service:
      main:
        ports:
          http:
            port: 80
        controller: main
        forceRename: prowlarr
    persistence:
      config:
        enabled: true
        existingClaim: prowlarr-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            prowlarr:
            - path: /config
            verify-restored-data:
            - path: /restore
              readOnly: true
  suspend: false
  # Preserve the immutable selector from the existing deployment during chart migration.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: prowlarr
        patch: |
          - op: replace
            path: /spec/selector
            value:
              matchLabels:
                app.kubernetes.io/instance: prowlarr
                app.kubernetes.io/name: prowlarr
