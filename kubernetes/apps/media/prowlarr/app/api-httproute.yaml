# API endpoints retain native API-key authentication.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr-api
  namespace: media
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - prowlarr.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: prowlarr
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: RegularExpression
        value: ^/[0-9]+/(api|download)/?$
