apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prowlarr-authelia
  namespace: media
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: prowlarr
  extAuth:
    headersToExtAuth:
    - accept
    - cookie
    - authorization
    - proxy-authorization
    - x-forwarded-proto
    failOpen: false
    http:
      backendRefs:
      - name: authelia
        namespace: security
        port: 9091
      path: /api/authz/ext-authz/
      headersToBackend:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
