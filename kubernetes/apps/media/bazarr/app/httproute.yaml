---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Subtitles
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-subtitles
    gethomepage.dev/href: https://bazarr.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - bazarr.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: bazarr
      port: 6767
