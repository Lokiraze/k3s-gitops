---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Subtitles
    gethomepage.dev/group: Media
    gethomepage.dev/icon: bazarr.svg
    gethomepage.dev/href: https://bazarr.${SECRET_DOMAIN}
    gethomepage.dev/description: Missing movie and episode subtitles
    gethomepage.dev/widget.type: bazarr
    gethomepage.dev/widget.url: http://bazarr.media.svc.cluster.local:6767
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_BAZARR_KEY}}'
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - bazarr.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: bazarr
      port: 6767
