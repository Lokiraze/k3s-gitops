---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: media
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - 'bazarr.${SECRET_DOMAIN}'
  rules:
  - backendRefs:
    - name: bazarr
      port: 6767
