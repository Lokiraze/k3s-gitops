---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-jellyseer-config
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-app-data
  claimRef:
    namespace: media
    name: jellyseer-config
  local:
    path: /var/lib/homelab/app-data/jellyseer-config
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-phoenix
