---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseer
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    initContainers:
      verify-restored-data:
        image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        command:
        - /bin/sh
        - -ec
        - test "$(cat /restore/.restore-verified)" = "jellyseer-config"; test -s /restore/settings.json
        volumeMounts:
        - name: config
          mountPath: /restore
          readOnly: true
    image:
      repository: ghcr.io/seerr-team/seerr
      tag: v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    env:
      TZ: ${TIMEZONE}
    service:
      main:
        ports:
          http:
            port: 5055
    ingress:
      main:
        enabled: false
        ingressClassName: nginx
        annotations:
          hajimari.io/enable: 'true'
          hajimari.io/icon: folder-play
        hosts:
        - host: requests.${SECRET_DOMAIN}
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - requests.${SECRET_DOMAIN}
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        enabled: true
        existingClaim: jellyseer-config
        mountPath: /app/config
  suspend: false
