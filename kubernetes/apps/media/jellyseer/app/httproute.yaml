---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyseer
  namespace: media
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - requests.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: jellyseer
      port: 5055
