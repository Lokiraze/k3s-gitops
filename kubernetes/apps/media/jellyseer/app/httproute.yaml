---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyseer
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Requests
    gethomepage.dev/group: Media
    gethomepage.dev/icon: seerr.svg
    gethomepage.dev/href: https://requests.${SECRET_DOMAIN}
    gethomepage.dev/description: Media requests
    gethomepage.dev/widget.type: seerr
    gethomepage.dev/widget.url: http://jellyseer.media.svc.cluster.local:5055
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_JELLYSEER_KEY}}'
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - requests.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: jellyseer
      port: 5055
