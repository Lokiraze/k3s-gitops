---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyseer
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Requests
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-movie-search
    gethomepage.dev/href: https://requests.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - requests.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: jellyseer
      port: 5055
