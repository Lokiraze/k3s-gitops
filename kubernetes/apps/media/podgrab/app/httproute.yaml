---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podgrab
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Podgrab
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-microphone
    gethomepage.dev/href: https://podcasts.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - podcasts.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: podgrab
      port: 8080
