---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podgrab
  namespace: media
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - podcasts.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: podgrab
      port: 8080
