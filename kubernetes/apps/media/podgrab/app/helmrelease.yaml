---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podgrab
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: podgrab
      nameOverride: podgrab
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: podgrab
        containers:
          podgrab:
            image:
              repository: ghcr.io/akhilrex/podgrab
              tag: 1.0.0@sha256:bce133f3f5111381f63d9341313fa7ce7e16209068e8a06e6db2c4ed33972b87
            env:
              TZ: ${TIMEZONE}
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 8080
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 8080
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  tcpSocket:
                    port: 8080
                  timeoutSeconds: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          verify-restored-data:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
            - /bin/sh
            - -ec
            - test "$(cat /restore/.restore-verified)" = "podgrab-config"; test -s /restore/podgrab.db
    service:
      main:
        ports:
          http:
            port: 8080
        controller: main
        forceRename: podgrab
    persistence:
      config:
        enabled: true
        existingClaim: podgrab-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            podgrab:
            - path: /config
            verify-restored-data:
            - path: /restore
              readOnly: true
      assets:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/podcasts
        advancedMounts:
          main:
            podgrab:
            - path: /assets
      downloads:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/downloads/
        advancedMounts:
          main:
            podgrab:
            - path: /downloads
  suspend: false
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: podgrab
        patch: "- op: replace\n  path: /spec/selector\n  value:\n    matchLabels:\n      app.kubernetes.io/instance:\
          \ podgrab\n      app.kubernetes.io/name: podgrab\n"
