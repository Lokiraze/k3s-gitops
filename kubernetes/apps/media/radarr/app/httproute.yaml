---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Movies
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-movie
    gethomepage.dev/href: https://movies.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - movies.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: radarr
      port: 80
