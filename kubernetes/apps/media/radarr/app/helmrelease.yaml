---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: radarr
      nameOverride: radarr
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: radarr
        containers:
          radarr:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.0.10815@sha256:c044b4df8e7b2546ef389481626a56fabe291575ff2d65481b1555432d6161ff
            env:
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: Enabled
              TZ: ${TIMEZONE}
              RADARR__INSTANCE_NAME: Radarr
              RADARR__PORT: 80
              RADARR__APPLICATION_URL: https://movies.${SECRET_DOMAIN}
              RADARR__LOG_LEVEL: info
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 80
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 80
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  tcpSocket:
                    port: 80
                  timeoutSeconds: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          verify-restored-data:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
            - /bin/sh
            - -ec
            - test "$(cat /restore/.restore-verified)" = "radarr-config"; test -s /restore/radarr.db
    service:
      main:
        ports:
          http:
            port: 80
        controller: main
        forceRename: radarr
    persistence:
      config:
        enabled: true
        existingClaim: radarr-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            radarr:
            - path: /config
            verify-restored-data:
            - path: /restore
              readOnly: true
      media:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/movies
        advancedMounts:
          main:
            radarr:
            - path: /media
      downloads:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/downloads/
        advancedMounts:
          main:
            radarr:
            - path: /downloads
  suspend: false
  # Preserve the immutable selector from the existing deployment during chart migration.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: radarr
        patch: |
          - op: replace
            path: /spec/selector
            value:
              matchLabels:
                app.kubernetes.io/instance: radarr
                app.kubernetes.io/name: radarr
