# API endpoints retain native API-key authentication.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr-api
  namespace: media
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - movies.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: radarr
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /api
