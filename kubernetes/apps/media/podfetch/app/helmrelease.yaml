---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podfetch
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    initContainers:
      verify-restored-data:
        image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        command:
        - /bin/sh
        - -ec
        - test "$(cat /restore/.restore-verified)" = "podfetch-config"; test -s /restore/podcast.db
        volumeMounts:
        - name: config
          mountPath: /restore
          readOnly: true
    image:
      repository: samuel19982/podfetch
      tag: latest@sha256:b4f0eac9d9d93f5b850e29546277ad3093fa6398e7a112c8a8867c0c9843883d
    env:
      TZ: ${TIMEZONE}
      DATABASE_URL: sqlite:///app/db/podcast.db
    service:
      main:
        ports:
          http:
            port: 8000
    ingress:
      main:
        enabled: false
        ingressClassName: nginx
        annotations:
          hajimari.io/enable: 'true'
          hajimari.io/icon: book-music
        hosts:
        - host: podcast.${SECRET_DOMAIN}
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - podcast.${SECRET_DOMAIN}
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        enabled: true
        existingClaim: podfetch-config
        mountPath: /app/db
      podcasts:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/podcasts
        mountPath: /app/podcasts
  suspend: false
