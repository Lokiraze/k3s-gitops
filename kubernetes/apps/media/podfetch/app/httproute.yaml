---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podfetch
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Podcasts
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-podcast
    gethomepage.dev/href: https://podcast.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - podcast.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: podfetch
      port: 8000
