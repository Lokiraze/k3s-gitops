---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podfetch
  namespace: media
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - podcast.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: podfetch
      port: 8000
