---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: readarr
  namespace: media
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - books.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: readarr
      port: 8787
