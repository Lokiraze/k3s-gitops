---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-readarr
  namespace: flux-system
spec:
  # Owner chose to retain backups and leave retired Readarr disabled.
  suspend: true
  interval: 30m
  path: ./kubernetes/apps/media/readarr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: legacy-app-settings
    - kind: Secret
      name: legacy-app-secrets
  targetNamespace: media
  wait: false
