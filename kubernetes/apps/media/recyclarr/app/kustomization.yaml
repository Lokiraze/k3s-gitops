---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
- ./state-pv.yaml
- ./state-pvc.yaml
- ./secret.sops.yaml
- ./helmrelease.yaml
configMapGenerator:
- name: recyclarr-configmap
  files:
  - ./recyclarr.yml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
