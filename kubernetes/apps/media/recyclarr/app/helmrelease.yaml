---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: recyclarr
      nameOverride: recyclarr
      createDefaultServiceAccount: false
    controllers:
      main:
        type: cronjob
        forceRename: recyclarr
        containers:
          recyclarr:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
            command:
            - /app/recyclarr/recyclarr
            args:
            - sync
            envFrom:
            - secretRef:
                name: recyclarr
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
        cronjob:
          schedule: '@daily'
          concurrencyPolicy: Forbid
          ttlSecondsAfterFinished: 86400
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          restartPolicy: OnFailure
    service:
      main:
        enabled: false
    persistence:
      config:
        enabled: true
        existingClaim: recyclarr-state
        type: persistentVolumeClaim
        advancedMounts:
          main:
            recyclarr:
            - path: /config
              subPath: ''
              readOnly: false
      config-file:
        enabled: true
        type: configMap
        name: recyclarr-configmap
        defaultMode: 509
        advancedMounts:
          main:
            recyclarr:
            - path: /config/recyclarr.yml
              subPath: recyclarr.yml
              readOnly: true
  suspend: false
