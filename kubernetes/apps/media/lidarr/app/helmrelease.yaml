---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: lidarr
      nameOverride: lidarr
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: lidarr
        containers:
          lidarr:
            image:
              repository: ghcr.io/linuxserver/lidarr
              tag: latest@sha256:d8549ff9ea29b4015c32257360652c1000c31ea471a2b3f0835ae77292faf35b
            env:
              LIDARR__AUTH__METHOD: External
              LIDARR__AUTH__REQUIRED: Enabled
              DOCKER_MODS: ghcr.io/themepark-dev/theme.park:lidarr
              TP_DOMAIN: theme-park.${SECRET_DOMAIN}
              TP_SCHEME: https
              TP_THEME: aquamarine
              TZ: ${TIMEZONE}
              PUID: '568'
              PGID: '568'
            resources:
              requests:
                cpu: 500m
                memory: 128Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 8686
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 8686
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  tcpSocket:
                    port: 8686
                  timeoutSeconds: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          verify-restored-data:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
            - /bin/sh
            - -ec
            - test "$(cat /restore/.restore-verified)" = "lidarr-config"; test -s /restore/lidarr.db
    service:
      main:
        ports:
          http:
            port: 8686
        controller: main
        forceRename: lidarr
    persistence:
      config:
        enabled: true
        existingClaim: lidarr-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            lidarr:
            - path: /config
            verify-restored-data:
            - path: /restore
              readOnly: true
      media:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/music
        advancedMounts:
          main:
            lidarr:
            - path: /media
      downloads:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/downloads/
        advancedMounts:
          main:
            lidarr:
            - path: /downloads
  suspend: false
  # Preserve the immutable selector from the existing deployment during chart migration.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: lidarr
        patch: |
          - op: replace
            path: /spec/selector
            value:
              matchLabels:
                app.kubernetes.io/instance: lidarr
                app.kubernetes.io/name: lidarr
