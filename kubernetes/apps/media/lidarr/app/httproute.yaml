---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Music Library
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-album
    gethomepage.dev/href: https://grooves.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - grooves.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: lidarr
      port: 8686
