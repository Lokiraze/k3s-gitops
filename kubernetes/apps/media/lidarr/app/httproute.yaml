---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Music Library
    gethomepage.dev/group: Media
    gethomepage.dev/icon: lidarr.svg
    gethomepage.dev/href: https://grooves.${SECRET_DOMAIN}
    gethomepage.dev/description: Artists, missing albums and queue
    gethomepage.dev/widget.type: lidarr
    gethomepage.dev/widget.url: http://lidarr.media.svc.cluster.local:8686
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_LIDARR_KEY}}'
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - grooves.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: lidarr
      port: 8686
