---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr
  namespace: media
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - grooves.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: lidarr
      port: 8686
