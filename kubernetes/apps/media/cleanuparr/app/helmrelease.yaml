---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cleanuparr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: cleanuparr
      nameOverride: cleanuparr
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        containers:
          cleanuparr:
            image:
              repository: ghcr.io/cleanuparr/cleanuparr
              tag: 2.10.12@sha256:d0212e4c66bd0522e23c5e5da5d3006bd5ff0e0de1e3ecfcf892e039d55721e2
            env:
              TZ: ${TIMEZONE}
              PUID: '568'
              PGID: '568'
              PORT: '11011'
              UMASK: '077'
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 11011
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 11011
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 11011
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          automountServiceAccountToken: false
        strategy: Recreate
    service:
      main:
        controller: main
        forceRename: cleanuparr
        ports:
          http:
            port: 11011
    persistence:
      config:
        enabled: true
        existingClaim: cleanuparr-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            cleanuparr:
            - path: /config
