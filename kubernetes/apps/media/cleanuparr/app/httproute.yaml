---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cleanuparr
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Cleanuparr
    gethomepage.dev/group: Media
    gethomepage.dev/icon: cleanuparr.svg
    gethomepage.dev/href: https://cleanuparr.${SECRET_DOMAIN}
    gethomepage.dev/description: Stalled download cleanup
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - cleanuparr.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: cleanuparr
      port: 11011
