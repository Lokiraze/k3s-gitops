---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisparr
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    initContainers:
      verify-restored-data:
        image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
        - /bin/sh
        - -ec
        - test "$(cat /restore/.restore-verified)" = "whisparr-config"; test -s /restore/whisparr2.db
        volumeMounts:
        - name: config
          mountPath: /restore
          readOnly: true
    image:
      repository: ghcr.io/hotio/whisparr
      tag: nightly-2.0.0.287
    env:
      TZ: ${TIMEZONE}
      PUID: 568
      PGID: 568
    service:
      main:
        ports:
          http:
            port: 6969
    ingress:
      main:
        enabled: false
        ingressClassName: nginx
        annotations: null
        hosts:
        - host: '{{ .Release.Name }}.${SECRET_DOMAIN}'
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - '{{ .Release.Name }}.${SECRET_DOMAIN}'
    persistence:
      config:
        enabled: true
        existingClaim: whisparr-config
      media:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/other
      downloads:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/downloads/
  suspend: false
