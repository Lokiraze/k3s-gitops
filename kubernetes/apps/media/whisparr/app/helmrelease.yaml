---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisparr
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: whisparr
      nameOverride: whisparr
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: whisparr
        containers:
          whisparr:
            image:
              repository: ghcr.io/hotio/whisparr
              tag: v3-3.6.5-release.1886@sha256:c21ee73285865bb89ccea37aa01bc403744bb2697898689aed03f24e85ff58cf
            env:
              WHISPARR__AUTH__METHOD: External
              WHISPARR__AUTH__REQUIRED: Enabled
              TZ: ${TIMEZONE}
              PUID: 568
              PGID: 568
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 6969
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 6969
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  tcpSocket:
                    port: 6969
                  timeoutSeconds: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
        initContainers:
          verify-restored-data:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
            command:
            - /bin/sh
            - -ec
            - test "$(cat /restore/.restore-verified)" = "whisparr-config"; test -s /restore/whisparr3.db
    service:
      main:
        ports:
          http:
            port: 6969
        controller: main
        forceRename: whisparr
    persistence:
      config:
        enabled: true
        existingClaim: whisparr-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            whisparr:
            - path: /config
            verify-restored-data:
            - path: /restore
              readOnly: true
      media:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/other
        advancedMounts:
          main:
            whisparr:
            - path: /media
      downloads:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/downloads/
        advancedMounts:
          main:
            whisparr:
            - path: /downloads
  suspend: false
  # Preserve the immutable selector from the existing deployment during chart migration.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: whisparr
        patch: |
          - op: replace
            path: /spec/selector
            value:
              matchLabels:
                app.kubernetes.io/instance: whisparr
                app.kubernetes.io/name: whisparr
