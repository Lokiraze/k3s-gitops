---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisparr
  namespace: media
  annotations:
    rebuild.homelab/status: suspended-pending-version-storage-and-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    image:
      repository: ghcr.io/hotio/whisparr
      tag: nightly-2.0.0.287
    env:
      TZ: ${TIMEZONE}
      PUID: 100
      PGID: 100
    service:
      main:
        ports:
          http:
            port: 6969
    ingress:
      main:
        enabled: false
        ingressClassName: nginx
        annotations: null
        hosts:
        - host: '{{ .Release.Name }}.${SECRET_DOMAIN}'
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - '{{ .Release.Name }}.${SECRET_DOMAIN}'
    persistence:
      config:
        enabled: true
        existingClaim: whisparr-config
      media:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/other
      downloads:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/downloads/
  suspend: true
