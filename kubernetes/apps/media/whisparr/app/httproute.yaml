---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whisparr
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Whisparr
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-movie-open
    gethomepage.dev/href: https://whisparr.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - whisparr.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: whisparr
      port: 6969
