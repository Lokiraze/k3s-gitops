---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calibre-web
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Books
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-book-open-page-variant
    gethomepage.dev/href: https://read.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - read.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: calibre-web
      port: 8083
