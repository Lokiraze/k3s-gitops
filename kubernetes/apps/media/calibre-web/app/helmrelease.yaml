---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 1.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    initContainers:
      verify-restored-data:
        image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
        command:
        - /bin/sh
        - -ec
        - test "$(cat /restore/.restore-verified)" = "calibre-web-config"; test -s /restore/app.db
        volumeMounts:
        - name: config
          mountPath: /restore
          readOnly: true
    image:
      repository: ghcr.io/linuxserver/calibre-web
      tag: latest@sha256:5dcbcb381d29c4ccb2236910eb547679f482c3eb1c9e458138729e89eceb4774
    env:
      TZ: ${TIMEZONE}
      PUID: "568"
      PGID: "568"
    service:
      main:
        ports:
          http:
            port: 8083
    ingress:
      main:
        enabled: false
        ingressClassName: nginx
        annotations:
          hajimari.io/enable: 'true'
          hajimari.io/icon: bookshelf
        hosts:
        - host: read.${SECRET_DOMAIN}
          paths:
          - path: /
            pathType: Prefix
        tls:
        - hosts:
          - read.${SECRET_DOMAIN}
    podSecurityContext:
      # LinuxServer init starts as root and drops the app to PUID/PGID.
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        enabled: true
        existingClaim: calibre-web-config
      books:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/books/calibre/Calibre Library
  suspend: false
