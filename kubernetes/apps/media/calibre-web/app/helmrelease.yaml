---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calibre-web
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: calibre-web
      nameOverride: calibre-web
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: calibre-web
        containers:
          calibre-web:
            image:
              repository: ghcr.io/linuxserver/calibre-web
              tag: latest@sha256:5dcbcb381d29c4ccb2236910eb547679f482c3eb1c9e458138729e89eceb4774
            env:
              DOCKER_MODS: ghcr.io/themepark-dev/theme.park:calibre-web
              TP_DOMAIN: theme-park.${SECRET_DOMAIN}
              TP_SCHEME: https
              TP_THEME: aquamarine
              TZ: ${TIMEZONE}
              PUID: '568'
              PGID: '568'
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 8083
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 8083
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  tcpSocket:
                    port: 8083
                  timeoutSeconds: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          verify-restored-data:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
            - /bin/sh
            - -ec
            - test "$(cat /restore/.restore-verified)" = "calibre-web-config"; test -s /restore/app.db
    service:
      main:
        ports:
          http:
            port: 8083
        controller: main
        forceRename: calibre-web
    persistence:
      config:
        enabled: true
        existingClaim: calibre-web-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            calibre-web:
            - path: /config
            verify-restored-data:
            - path: /restore
              readOnly: true
      books:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/books/calibre/Calibre Library
        advancedMounts:
          main:
            calibre-web:
            - path: /books
  suspend: false
  # Preserve the immutable selector from the existing deployment during chart migration.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: calibre-web
        patch: |
          - op: replace
            path: /spec/selector
            value:
              matchLabels:
                app.kubernetes.io/instance: calibre-web
                app.kubernetes.io/name: calibre-web
