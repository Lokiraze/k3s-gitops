# Only the API bypasses Authelia; Sonarr still requires its API key.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr-api
  namespace: media
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - tv.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: sonarr
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /api
