---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: media
  annotations:
    rebuild.homelab/status: active-after-restore-checks
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: sonarr
      nameOverride: sonarr
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: sonarr
        containers:
          sonarr:
            image:
              repository: ghcr.io/linuxserver/sonarr
              tag: version-4.0.20.3014@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
            env:
              DOCKER_MODS: ghcr.io/themepark-dev/theme.park:sonarr
              TP_DOMAIN: theme-park.${SECRET_DOMAIN}
              TP_SCHEME: https
              TP_THEME: aquamarine
              TZ: ${TIMEZONE}
              PUID: '568'
              PGID: '568'
              SONARR__INSTANCE_NAME: Sonarr
              SONARR__PORT: 80
              SONARR__APPLICATION_URL: https://tv.${SECRET_DOMAIN}
              SONARR__LOG_LEVEL: info
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 80
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 80
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  tcpSocket:
                    port: 80
                  timeoutSeconds: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: true
          enableServiceLinks: true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          verify-restored-data:
            image:
              repository: docker.io/library/busybox
              tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
            command:
            - /bin/sh
            - -ec
            - test "$(cat /restore/.restore-verified)" = "sonarr-config"; test -s /restore/sonarr.db
    service:
      main:
        ports:
          http:
            port: 80
        controller: main
        forceRename: sonarr
    persistence:
      config:
        enabled: true
        existingClaim: sonarr-config
        type: persistentVolumeClaim
        advancedMounts:
          main:
            sonarr:
            - path: /config
            verify-restored-data:
            - path: /restore
              readOnly: true
      media:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/tvshows
        advancedMounts:
          main:
            sonarr:
            - path: /media
      downloads:
        enabled: true
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/downloads/
        advancedMounts:
          main:
            sonarr:
            - path: /downloads
  suspend: false
  # Preserve the immutable selector from the existing deployment during chart migration.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: sonarr
        patch: |
          - op: replace
            path: /spec/selector
            value:
              matchLabels:
                app.kubernetes.io/instance: sonarr
                app.kubernetes.io/name: sonarr
