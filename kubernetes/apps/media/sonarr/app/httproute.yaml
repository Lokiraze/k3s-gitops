---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: TV Shows
    gethomepage.dev/group: Media
    gethomepage.dev/icon: mdi-television
    gethomepage.dev/href: https://tv.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - tv.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: sonarr
      port: 80
