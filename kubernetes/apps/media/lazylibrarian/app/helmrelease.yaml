apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lazylibrarian
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: lazylibrarian
      nameOverride: lazylibrarian
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: lazylibrarian
        containers:
          lazylibrarian:
            image:
              repository: ghcr.io/linuxserver/lazylibrarian
              tag: latest@sha256:1b562efd3202fd7d1a3b330aff773a08831c02df5e5d283397fe70a34e843c78
            env:
              TZ: ${TIMEZONE}
              PUID: '568'
              PGID: '568'
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 5299
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 5299
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  tcpSocket:
                    port: 5299
                  timeoutSeconds: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          enableServiceLinks: true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        ports:
          http:
            port: 5299
        controller: main
        forceRename: lazylibrarian
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: lazylibrarian-config
        globalMounts:
        - path: /config
      books:
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/books
        globalMounts:
        - path: /books
      downloads:
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/downloads
        globalMounts:
        - path: /downloads
  suspend: false
