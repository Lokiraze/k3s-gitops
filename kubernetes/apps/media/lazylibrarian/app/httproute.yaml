apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lazylibrarian
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: LazyLibrarian
    gethomepage.dev/group: Media
    gethomepage.dev/icon: lazylibrarian.svg
    gethomepage.dev/href: https://librarian.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - librarian.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: lazylibrarian
      port: 5299
