apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sportarr
  namespace: media
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/name: Sportarr
    gethomepage.dev/group: Media
    gethomepage.dev/icon: sportarr.svg
    gethomepage.dev/href: https://sports.${SECRET_DOMAIN}
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - sportarr.${SECRET_DOMAIN}
  rules:
  - backendRefs:
    - name: sportarr
      port: 1867
