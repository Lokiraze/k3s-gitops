apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sportarr
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sportarr
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: network
      podSelector:
        matchLabels:
          gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: media
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prowlarr
    ports:
    - protocol: TCP
      port: 1867
