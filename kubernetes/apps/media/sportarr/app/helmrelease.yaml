apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sportarr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      fullnameOverride: sportarr
      nameOverride: sportarr
      createDefaultServiceAccount: false
    controllers:
      main:
        type: deployment
        forceRename: sportarr
        containers:
          sportarr:
            image:
              repository: docker.io/sportarr/sportarr
              tag: latest@sha256:8d6d301576b24be1b1ba889ec40c9e09fd3e5cba5c4a9729989c343918701dc8
            env:
              TZ: ${TIMEZONE}
              PUID: '568'
              PGID: '568'
              UMASK: '002'
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 1867
                  timeoutSeconds: 1
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  periodSeconds: 10
                  successThreshold: 1
                  tcpSocket:
                    port: 1867
                  timeoutSeconds: 1
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
                  successThreshold: 1
                  tcpSocket:
                    port: 1867
                  timeoutSeconds: 1
        strategy: Recreate
        pod:
          automountServiceAccountToken: false
          enableServiceLinks: true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        ports:
          http:
            port: 1867
        controller: main
        forceRename: sportarr
    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: sportarr-config
        globalMounts:
        - path: /config
      media:
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/media/sports
        globalMounts:
        - path: /media
      downloads:
        type: nfs
        server: ${NFS_SERVER}
        path: /mnt/user/downloads
        globalMounts:
        - path: /downloads
  suspend: false
