apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tds
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/nsg/tds/app
  prune: true
  dependsOn:
  - name: tds-bootstrap
  - name: agones
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: nsg
  wait: false
  timeout: 10m
