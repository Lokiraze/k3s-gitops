apiVersion: v1
kind: ConfigMap
metadata:
  name: tds-seed-v002
data:
  seed.sql: |
    -- TDS Asset Database Seed
    -- All entries: version 1, status 'published'
    --
    -- Tables are created here so the seed can run during postgres init
    -- (before GORM AutoMigrate). AutoMigrate only adds missing columns/tables
    -- so these definitions won't conflict.

    BEGIN;

    -- ============================================
    -- Schema (matches GORM AutoMigrate output)
    -- ============================================

    CREATE TABLE IF NOT EXISTS weapon_behaviors (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        on_trigger_hit JSONB,
        on_trigger_held JSONB,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS melee_weapons (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        animation_type TEXT NOT NULL,
        data JSONB NOT NULL,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS ranged_weapons (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        ammo_category TEXT,
        behavior_key TEXT NOT NULL,
        data JSONB NOT NULL,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS thrown_weapons (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        trigger_mode TEXT NOT NULL,
        behavior_key TEXT NOT NULL,
        data JSONB NOT NULL,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS enemies (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        disposition TEXT NOT NULL,
        color JSONB,
        attributes JSONB NOT NULL,
        loadout JSONB NOT NULL,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS deployables (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        kind TEXT NOT NULL,
        health REAL NOT NULL,
        duration_secs REAL NOT NULL,
        config JSONB NOT NULL,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS skills (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        cooldown REAL NOT NULL,
        target TEXT NOT NULL,
        deployable_key TEXT,
        data JSONB NOT NULL,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS objectives (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        objective_type TEXT NOT NULL,
        discovery_radius REAL NOT NULL DEFAULT 0,
        data JSONB NOT NULL,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS prefabs (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        mode TEXT NOT NULL,
        data JSONB NOT NULL,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS map_configs (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        width BIGINT NOT NULL,
        height BIGINT NOT NULL,
        tile_size BIGINT NOT NULL,
        tileset TEXT NOT NULL,
        pipeline JSONB NOT NULL,
        spawners JSONB NOT NULL,
        seed BIGINT,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS maps (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        min_players BIGINT NOT NULL,
        max_players BIGINT NOT NULL,
        map_config_key TEXT NOT NULL,
        enemy_keys JSONB NOT NULL,
        objective_keys JSONB NOT NULL,
        escalation JSONB NOT NULL,
        engagement JSONB NOT NULL,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS player_profiles (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        user_id UUID NOT NULL,
        salvage REAL NOT NULL DEFAULT 0,
        CONSTRAINT uni_player_profiles_user_id UNIQUE (user_id)
    );

    CREATE TABLE IF NOT EXISTS player_weapons (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL,
        weapon_id UUID NOT NULL,
        weapon_type TEXT NOT NULL,
        acquired_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
        UNIQUE (user_id, weapon_id, weapon_type)
    );

    CREATE TABLE IF NOT EXISTS weapon_rotations (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        weapon_id UUID NOT NULL,
        weapon_type TEXT NOT NULL,
        started_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
        ended_at TIMESTAMPTZ
    );
    CREATE INDEX IF NOT EXISTS idx_rotation_lookup ON weapon_rotations (weapon_id, weapon_type, ended_at);

    CREATE TABLE IF NOT EXISTS game_results (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        map_id UUID NOT NULL,
        user_id UUID NOT NULL,
        is_victory BOOLEAN NOT NULL,
        damage_dealt REAL NOT NULL DEFAULT 0,
        damage_taken REAL NOT NULL DEFAULT 0,
        player_kills BIGINT NOT NULL DEFAULT 0,
        npc_kills BIGINT NOT NULL DEFAULT 0,
        assists BIGINT NOT NULL DEFAULT 0,
        shots_fired BIGINT NOT NULL DEFAULT 0,
        shots_hit BIGINT NOT NULL DEFAULT 0,
        enemies_encountered BIGINT NOT NULL DEFAULT 0,
        time_survived_secs REAL NOT NULL DEFAULT 0,
        salvage REAL NOT NULL DEFAULT 0,
        exploration_percent REAL NOT NULL DEFAULT 0,
        exploration_bonus REAL NOT NULL DEFAULT 0,
        survive_bonus REAL NOT NULL DEFAULT 0,
        betrayal_extract_bonus REAL NOT NULL DEFAULT 0,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS weapon_stats (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        game_result_id UUID,
        player_id UUID,
        weapon_id UUID,
        slot TEXT,
        damage_dealt REAL,
        kills BIGINT,
        uses BIGINT,
        hits BIGINT,
        time_active_secs REAL,
        UNIQUE (key, version)
    );

    -- ============================================
    -- Weapon Behaviors
    -- ============================================

    INSERT INTO weapon_behaviors (id, key, version, status, name, on_trigger_hit, on_trigger_held) VALUES
