apiVersion: batch/v1
kind: Job
metadata:
  name: tds-bootstrap-v002
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
      - name: create-database
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
        - name: PGHOST
          value: postgres.nsg.svc.cluster.local
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: nsg-dependencies
              key: POSTGRES_PASSWORD
        - name: TDS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tds-runtime
              key: TDS_DB_PASSWORD
        command:
        - sh
        - -ec
        args:
        - |
          psql --dbname=postgres --set=ON_ERROR_STOP=1 --set=tds_password="$TDS_DB_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE tds LOGIN PASSWORD %L', :'tds_password')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'tds') \gexec
          SELECT 'CREATE DATABASE tds OWNER tds'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'tds') \gexec
          SQL
          export PGUSER=tds PGPASSWORD="$TDS_DB_PASSWORD"
          tables=$(psql --dbname=tds -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          if [ "$tables" = 0 ]; then
            psql --dbname=tds -v ON_ERROR_STOP=1 -f /seed/seed.sql
          else
            echo 'Existing TDS database left unchanged.'
          fi
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
      volumes:
      - name: seed
        configMap:
          name: tds-seed-v002
