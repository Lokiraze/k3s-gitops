apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tds-portal
spec:
  parentRefs:
  - name: envoy-internal
    namespace: network
    sectionName: https
  hostnames:
  - nsg.lokiraze.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /games/tds
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        hostname: tds.lokiraze.dev
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
        statusCode: 302
