apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: identity
  namespace: nsg
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: identity
  values:
    imagePullSecrets:
    - name: gitea-registry
    api:
      configSecret: identity-config
      cache:
        host: redis.nsg.svc.cluster.local:6379
        passwordSecret: nsg-dependencies
        passwordKey: REDIS_PASSWORD
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
    portal:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    route:
      enabled: false
