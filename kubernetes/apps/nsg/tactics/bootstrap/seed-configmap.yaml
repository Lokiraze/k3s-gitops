apiVersion: v1
kind: ConfigMap
metadata:
  name: tactics-seed-v005
data:
  seed.sql: |
    -- Tactics Asset Database Seed
    -- All entries: version 1, status 'published'
    --
    -- Tables are created here so the seed can run during postgres init
    -- (before GORM AutoMigrate). AutoMigrate only adds missing columns/tables
    -- so these definitions won't conflict.

    BEGIN;

    -- ============================================
    -- Schema (matches GORM AutoMigrate output)
    -- ============================================

    CREATE TABLE IF NOT EXISTS status_effects (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        description TEXT NOT NULL,
        icon TEXT NOT NULL,
        round_duration BIGINT NOT NULL DEFAULT 0,
        application_tick BIGINT NOT NULL DEFAULT 0,
        effect_id TEXT NOT NULL,
        stacking TEXT NOT NULL DEFAULT 'Replace',
        data JSONB NOT NULL,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS actions (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        description TEXT NOT NULL,
        icon TEXT NOT NULL,
        destination TEXT NOT NULL,
        target_type TEXT NOT NULL,
        status_effect_ids JSONB,
        costs JSONB NOT NULL,
        prediction JSONB NOT NULL,
        application JSONB NOT NULL,
        animation JSONB,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS equipment (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        description TEXT NOT NULL,
        icon TEXT NOT NULL,
        slot TEXT NOT NULL,
        price REAL NOT NULL DEFAULT 0,
        action_ids JSONB NOT NULL,
        stat_bonuses JSONB NOT NULL,
        stat_requirements JSONB NOT NULL DEFAULT '{}',
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS character_templates (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        backstory TEXT NOT NULL,
        profile_image TEXT NOT NULL,
        body JSONB NOT NULL,
        UNIQUE (key, version)
    );

    CREATE TABLE IF NOT EXISTS tactics_maps (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        created_at TIMESTAMPTZ DEFAULT CURRENT_TIMESTAMP,
        key TEXT NOT NULL,
        version BIGINT NOT NULL,
        status TEXT NOT NULL DEFAULT 'draft',
        name TEXT NOT NULL,
        tileset TEXT NOT NULL,
        width BIGINT NOT NULL,
        height BIGINT NOT NULL,
        depth BIGINT NOT NULL,
        tile_width BIGINT NOT NULL,
        tile_height BIGINT NOT NULL,
        max_players BIGINT NOT NULL,
        map_type TEXT NOT NULL,
        collision JSONB NOT NULL,
        placement_zones JSONB NOT NULL,
        UNIQUE (key, version)
    );

    -- ============================================
    -- Status Effects
    -- ============================================

