apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tactics-bootstrap
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/nsg/tactics/bootstrap
  prune: true
  dependsOn:
  - name: cluster-apps-nsg-dependencies
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: nsg
  wait: true
  timeout: 10m
