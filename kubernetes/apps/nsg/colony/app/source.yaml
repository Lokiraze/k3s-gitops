apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: colony
  namespace: nsg
spec:
  interval: 1m
  url: oci://git.noshamegames.com/games/charts/colony
  ref:
    semver: '>=0.0.2 <1.0.0'
  secretRef:
    name: gitea-registry
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
