apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-colony-saves
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-app-data
  claimRef:
    namespace: nsg
    name: colony-saves
  local:
    path: /var/lib/homelab/app-data/colony-saves
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-odin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: colony-saves
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-app-data
  volumeName: local-colony-saves
  resources:
    requests:
      storage: 5Gi
