    \ VALUES ('72d9477a-209f-53c9-bc0e-f79daed0e44b','Sparklurk','A not so mild-mannered\
    \ bot in charge of the paper work for the mines. His inbox is always immaculate,\
    \ his outbox... full of ashes.','6|7|P|9|5','fb3d38e9-77a1-5401-b048-dc7bd08a2218','570e5cb4-6056-5234-8542-8b251a993590','/api/artwork/sparklurk-portrait.jpg','/api/artwork/sparklurk.jpg','sparklurk','1','published')\
