    \ VALUES ('5dc9569b-0086-503a-9d14-4bee7c0ab30c','Mist Cloaker','This frog uses\
    \ its steam engine to create a croa- *ehem* cloaking mist to conceal it from predators.','12|8|M|12|9','16b2190f-7432-52ab-b6b4-3cacaf0636c3','e31d8d7e-3f1c-51ae-ad08-152b858d19bf','/api/artwork/mist-cloaker-portrait.jpg','/api/artwork/mist-cloaker.png','mist_cloaker','1','published')\
    \ ON CONFLICT (id) DO NOTHING;\nINSERT INTO creatures(id,name,description,stats,faction_id,type_id,thumbnail,image,key,version,status)\
    \ VALUES ('569453b9-ab56-5d54-acae-a1a230ebb2ca','Reig Rim','About the size of\
    \ an adult human''''s hand. Their glass wings are prized finds among the leaf\
    \ litter, and often used to decorate. Warning: Carniverous','6|7|P|9|5','16b2190f-7432-52ab-b6b4-3cacaf0636c3','570e5cb4-6056-5234-8542-8b251a993590','/api/artwork/reig-rim-portrait.jpg','/api/artwork/reig-rim.jpg','reig_rim','1','published')\
