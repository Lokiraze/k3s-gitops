apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    # Bootstrap scripts preserve existing databases when recreated after image updates.
    kustomize.toolkit.fluxcd.io/force: enabled
  name: steamtactics-seed-v005
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
      - name: seed
        image: postgres:17.12-bookworm@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
        env:
        - name: DATABASE_DSN
          valueFrom:
            secretKeyRef:
              name: steamtactics-runtime
              key: database-dsn
        command: [sh, -ec]
        args:
        - |
          tables=$(psql "$DATABASE_DSN" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          if [ "$tables" = 0 ]; then
            psql "$DATABASE_DSN" -v ON_ERROR_STOP=1 -f /seed/seed.sql
          else
            echo 'Existing SteamTactics database left unchanged.'
          fi
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
      volumes:
      - name: seed
        configMap:
          name: steamtactics-seed-v005
