apiVersion: batch/v1
kind: Job
metadata:
  name: steamtactics-seed-v005
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
      - name: seed
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
        - name: DATABASE_DSN
          valueFrom:
            secretKeyRef:
              name: steamtactics-runtime
              key: database-dsn
        command: [sh, -ec]
        args:
        - |
          tables=$(psql "$DATABASE_DSN" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          if [ "$tables" = 0 ]; then
            psql "$DATABASE_DSN" -v ON_ERROR_STOP=1 -f /seed/seed.sql
          else
            echo 'Existing SteamTactics database left unchanged.'
          fi
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
        volumeMounts:
        - name: seed
          mountPath: /seed
          readOnly: true
      volumes:
      - name: seed
        configMap:
          name: steamtactics-seed-v005
