apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nats
        image: nats:2.15.2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
        args:
        - --auth
        - $(NATS_TOKEN)
        - --http_port
        - '8222'
        env:
        - name: NATS_TOKEN
          valueFrom:
            secretKeyRef:
              name: nsg-nats
              key: NATS_TOKEN
        ports:
        - name: client
          containerPort: 4222
        - name: monitor
          containerPort: 8222
        readinessProbe:
          httpGet:
            path: /healthz
            port: monitor
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
