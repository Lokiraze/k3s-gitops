apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-nsg-postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-app-data
  claimRef:
    namespace: nsg
    name: postgres-data
  local:
    path: /var/lib/homelab/app-data/nsg-postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-bahamut
---
