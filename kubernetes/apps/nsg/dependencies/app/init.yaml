apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-databases.sh: '#!/bin/sh

    set -eu

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres --set=identity_password="$IDENTITY_DB_PASSWORD"
    --set=steamtactics_password="$STEAMTACTICS_DB_PASSWORD" <<''SQL''

    CREATE ROLE identity LOGIN PASSWORD :''identity_password'';

    CREATE DATABASE identity OWNER identity;

    CREATE ROLE steamtactics LOGIN PASSWORD :''steamtactics_password'';

    CREATE DATABASE steamtactics OWNER steamtactics;

    SQL

    '
