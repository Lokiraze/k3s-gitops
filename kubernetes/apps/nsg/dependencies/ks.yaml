apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-nsg-dependencies
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/nsg/dependencies/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: nsg
  wait: false
