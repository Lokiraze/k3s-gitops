apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agones
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/agones-system/agones/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: agones-system
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: agones
    namespace: agones-system
