---
- name: Install the fresh k3s foundation
  hosts: kubernetes
  become: true
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Require all initial nodes for cluster bootstrap
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | sort == groups['kubernetes'] | sort
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_release == 'bookworm'
    - name: Detect existing Kubernetes data
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s
      register: existing_k3s
    - name: Detect a cluster installed by this rebuild
      ansible.builtin.stat:
        path: /etc/rancher/k3s/rebuild-managed
      register: rebuild_managed
    - name: Refuse to overwrite or jump-upgrade the old cluster
      ansible.builtin.assert:
        that:
          - not existing_k3s.stat.exists or rebuild_managed.stat.exists
        fail_msg: Old k3s data exists. Complete final backups and the reviewed cluster teardown first. This playbook never uninstalls the old cluster.
  tasks:
    - name: Install pinned k3s with embedded etcd
      ansible.builtin.include_role:
        name: xanmanning.k3s
        public: true
      vars:
        k3s_state: installed
    - name: Record ownership of the new installation
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/rebuild-managed
        content: "Debian k3s rebuild\n"
        mode: "0600"
    - name: Configure API virtual address independently of the CNI
      ansible.builtin.include_tasks: tasks/keepalived.yaml
      when: k3s_control_node | bool
    - name: Apply API address configuration before fetching kubeconfig
      ansible.builtin.meta: flush_handlers
    - name: Fetch private kubeconfig from the first server
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/../../kubeconfig"
        flat: true
      when: inventory_hostname == 'k8s-summoner'
    - name: Point local kubeconfig at the reserved API address
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/../../kubeconfig"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ kube_vip_addr }}:6443"
      delegate_to: localhost
      become: false
      run_once: true
    - name: Restrict local kubeconfig permissions
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true
  handlers:
    - name: Restart keepalived
      ansible.builtin.systemd_service:
        name: keepalived
        state: restarted
