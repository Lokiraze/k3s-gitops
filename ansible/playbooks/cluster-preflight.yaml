---
- name: Inspect Debian before maintenance
  hosts: kubernetes:deferred
  become: true
  gather_facts: true
  tasks:
    - name: Report OS and kernel
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}, kernel {{ ansible_facts.kernel }}"
    - name: Read disk layout and available space
      ansible.builtin.command: "{{ item }}"
      loop:
        - lsblk -o NAME,SIZE,TYPE,TRAN,SERIAL,MOUNTPOINTS
        - df -h /
        - apt-cache policy
      register: preflight
      changed_when: false
      check_mode: false
    - name: Show maintenance inventory
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ preflight.results }}"
      loop_control:
        label: "{{ item.item }}"
