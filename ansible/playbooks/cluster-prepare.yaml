---
- name: Prepare Debian for k3s
  hosts: kubernetes
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  pre_tasks:
    - name: Require the supported Debian release
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_release == 'bookworm'
        fail_msg: Review another Debian release before changing this playbook.
  tasks:
    - name: Install Kubernetes and hardware support packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, conntrack, iptables, nfs-common, python3, python3-apt, smartmontools, nvme-cli, pciutils, usbutils, mokutil, apparmor]
        update_cache: true
        install_recommends: false
    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
    - name: Disable active swap for kubelet
      ansible.builtin.command: swapoff -a
      when: ansible_facts.swaptotal_mb | int > 0
      changed_when: true
    - name: Disable fstab swap on subsequent boots
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\s]+\s+\S+\s+swap\s+.*)$'
        replace: '# k3s: \1'
    - name: Persist required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k3s.conf
        content: "overlay\nbr_netfilter\n"
        mode: "0644"
    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [overlay, br_netfilter]
    - name: Enable forwarding and raise inotify limits
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-kubernetes.conf
        reload: true
      loop: "{{ settings | dict2items }}"
      vars:
        settings:
          net.ipv4.ip_forward: "1"
          fs.inotify.max_user_watches: "524288"
          fs.inotify.max_user_instances: "8192"

    - name: Identify the root filesystem block device
      ansible.builtin.command: findmnt -n -o SOURCE /
      register: root_device
      changed_when: false
    - name: Identify the physical root disk
      ansible.builtin.command:
        argv: [lsblk, --inverse, --noheadings, --output, SERIAL, "{{ root_device.stdout }}"]
      register: root_serials
      changed_when: false
    - name: Require the intended internal SSD for application data
      ansible.builtin.assert:
        that:
          - internal_disk_serial in (root_serials.stdout_lines | map('trim') | list)
        fail_msg: Root is not on the recorded internal SSD; review storage before creating application paths.
    - name: Create application storage on the existing internal root filesystem
      ansible.builtin.file:
        path: /var/lib/homelab/app-data
        state: directory
        owner: root
        group: root
        mode: "0750"
    - name: Ensure application data does not resolve to another mount
      ansible.builtin.command: findmnt -n -o TARGET --target /var/lib/homelab/app-data
      register: app_data_mount
      changed_when: false
      failed_when: app_data_mount.stdout != '/'
      when: not ansible_check_mode
