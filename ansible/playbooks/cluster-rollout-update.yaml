---
- name: Update Debian packages within the existing release
  hosts: kubernetes:deferred
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  pre_tasks:
    - name: Require a deliberate maintenance target
      ansible.builtin.assert:
        that:
          - maintenance_confirmed | default(false) | bool
          - ansible_limit | default('') | length > 0
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_release == 'bookworm'
        fail_msg: Run preflight, verify backups, and pass --limit HOST -e maintenance_confirmed=true. This is not a Debian release upgrade.
    - name: Find configured package sources
      ansible.builtin.find:
        paths: /etc/apt
        patterns: ['*.list', '*.sources']
        recurse: true
      register: apt_sources
    - name: Read package sources
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ apt_sources.files }}"
      register: apt_source_contents
      no_log: true
    - name: Reject unsupported Debian suites that could change the OS release
      ansible.builtin.assert:
        that:
          - "(((item.content | b64decode | regex_findall('(?m)^[ \\\\t]*deb(?:-src)?[ \\\\t]+(?:\\\\[[^\\\\]\\\\n]*\\\\][ \\\\t]+)?\\\\S+[ \\\\t]+([^ \\\\t\\\\r\\\\n]+)')) + (item.content | b64decode | regex_findall('(?im)^Suites:[ \\\\t]*([^\\\\n]*(?:\\\\n[ \\\\t]+[^\\\\n]+)*)') | join(' ') | split)) | difference(['bookworm', 'bookworm-updates', 'bookworm-security', 'bookworm-backports'])) | length == 0"
        fail_msg: Use only bookworm, bookworm-updates, bookworm-security or bookworm-backports suites before running updates.
      loop: "{{ apt_source_contents.results }}"
      no_log: true
  tasks:
    - name: Update installed packages without removing packages or rewriting sources
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe
    - name: Report whether Debian requests a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
    - name: Report next maintenance step
      ansible.builtin.debug:
        msg: "Package update complete. Reboot requested: {{ reboot_required.stat.exists }}. Review kernel/firmware updates and cluster health before rebooting."
