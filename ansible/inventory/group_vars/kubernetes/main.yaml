---
# renovate: datasource=github-releases depName=k3s-io/k3s
k3s_release_version: "v1.37.1+k3s1"
k3s_become: true
k3s_build_cluster: true
k3s_etcd_datastore: true
# Joining the first server must not depend on a VIP that is not installed yet.
k3s_registration_address: "{{ hostvars['k8s-summoner'].ansible_host }}"
k3s_primary_control_node: "{{ inventory_hostname == 'k8s-summoner' }}"
# Nodes cannot become Ready until the subsequent Helm/Cilium bootstrap.
k3s_skip_post_checks: true
k3s_server_manifests_templates: []
k3s_server_manifests_urls: []
k3s_server_pod_manifests_templates: []
