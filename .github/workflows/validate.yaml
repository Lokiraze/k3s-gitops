name: Validate cluster configuration

on:
  pull_request:
  push:
    branches: [main, feat-upgrade-to-talos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: uv run --locked pytest -q
      - run: just ansible deps
      - run: just ansible syntax
      - run: bash scripts/validate-kubernetes.sh kubernetes
      - run: just check-charts
